<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>호가플레이 — 과거 호가·체결 다시보기</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f3f4f6;
      color: #444;
      font-family: Arial, "Noto Sans KR", sans-serif;
      font-size: 12px;
      letter-spacing: 0;
    }
    .app {
      width: min(100vw, 512px);
      margin: 0 auto;
      background: white;
      border: 1px solid #cfcfcf;
      box-shadow: 0 1px 5px rgba(0,0,0,.08);
    }
    .toolbar {
      display: grid;
      grid-template-columns: 88px 34px 1fr 34px 34px 34px;
      height: 34px;
      border-bottom: 1px solid #9e8f8f;
      background: #e9e9e9;
    }
    .toolbar input {
      width: 100%;
      border: 0;
      border-right: 1px solid #c6c6c6;
      padding: 0 10px;
      background: #fafafa;
      color: #555;
      outline: 0;
      font-size: 12px;
    }
    .tool-btn {
      display: grid;
      place-items: center;
      border: 0;
      border-right: 1px solid rgba(255,255,255,.25);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    .blue { background: #2f80c4; }
    .cyan { background: #35b9d6; }
    .orange { background: #f0a33c; }
    .header-strip {
      height: 18px;
      line-height: 18px;
      padding: 0 8px;
      background: #a99;
      color: white;
      font-weight: 700;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .mini-row, .labels-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      height: 15px;
      text-align: center;
      line-height: 15px;
      border-bottom: 1px solid #e4e4e4;
    }
    .mini-row div { background: #eadf95; border-right: 1px solid white; }
    .labels-row div { background: #cfdfb9; border-right: 1px solid white; font-weight: 700; color: #49633b; }
    .book {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      border-left: 1px solid #ededed;
      border-bottom: 1px solid #bfbfbf;
    }
    .cell {
      height: 15px;
      line-height: 15px;
      padding: 0 3px;
      overflow: hidden;
      white-space: nowrap;
      text-align: right;
      border-right: 1px solid #ededed;
      border-bottom: 1px solid #ededed;
    }
    .center { text-align: center; }
    .left { text-align: left; }
    .ask { background: #eaf3fb; }
    .ask.price { background: #b8d5ea; color: #175982; font-weight: 700; }
    .bid { background: #fff8ee; }
    .bid.price { background: #f5c8c8; color: #9b3131; font-weight: 700; }
    .cell.price { cursor: pointer; }
    .cell.price:hover { outline: 1px solid #287bbe; outline-offset: -1px; }
    .stat { background: #fbf6ef; color: #444; }
    .muted { color: #9a9a9a; }
    .speed-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      height: 30px;
      background: #f4e4f4;
      border-bottom: 1px solid #ededed;
    }
    .speed-row div { border-right: 1px solid #eee; }
    .speed {
      display: grid;
      place-items: center;
      background: #55b85a;
      color: white;
      font-weight: 700;
      grid-column: 4 / 5;
      height: 15px;
      margin-top: 15px;
      cursor: pointer;
    }
    .control-strip {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 4px;
      padding: 4px 20px;
      border-bottom: 1px solid #ddd;
    }
    .control-strip button {
      height: 42px;
      border: 0;
      border-radius: 3px;
      color: white;
      cursor: pointer;
      font-weight: 700;
    }
    .step { background: #2e80bd; }
    .small-step { background: #41bdd3; }
    .play { background: #55b85a; }
    .inputs {
      display: grid;
      grid-template-columns: 100px 1fr 34px 66px;
      gap: 16px;
      padding: 4px;
      align-items: center;
      border-bottom: 1px solid #ddd;
    }
    .inputs input {
      height: 28px;
      border: 1px solid #d4d4d4;
      padding: 0 8px;
      min-width: 0;
    }
    .chip {
      height: 28px;
      line-height: 28px;
      text-align: center;
      border: 1px solid #ddd;
      background: linear-gradient(#fff, #eee);
      border-radius: 4px;
    }
    .chip.button-like { cursor: pointer; user-select: none; }
    .trade {
      display: grid;
      grid-template-columns: 34px 88px 44px 44px 58px 1fr 54px;
      gap: 1px;
      padding: 4px 4px 0;
      align-items: center;
      background: #fafafa;
    }
    .trade div, .trade button, .trade input {
      height: 30px;
      border: 1px solid #d6d6d6;
      background: white;
      color: #666;
      text-align: center;
      line-height: 28px;
    }
    .trade input {
      width: 100%;
      min-width: 0;
      padding: 0 6px;
      line-height: normal;
      text-align: right;
    }
    .trade button { border: 0; color: white; cursor: pointer; }
    .buy { background: #df5a56 !important; }
    .sell { background: #277abd !important; }
    .tabbar {
      display: grid;
      grid-template-columns: 36px 36px 36px 1fr 52px 52px 38px 1fr 54px;
      gap: 2px;
      padding: 4px;
      align-items: center;
    }
    .icon-btn, .tab {
      height: 30px;
      border: 0;
      color: white;
      background: #287bbe;
      font-weight: 700;
    }
    .share { background: #eba93d; }
    .qty { height: 30px; border: 1px solid #d6d6d6; padding: 0 8px; text-align: right; }
    .size-strip {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 3px;
      padding: 0 4px 4px;
      background: #fafafa;
    }
    .size-strip button {
      height: 26px;
      border: 0;
      background: #6d7f8f;
      color: white;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }
    .broker {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 1px solid #dedede;
    }
    .broker-title {
      height: 15px;
      text-align: center;
      line-height: 15px;
      border-bottom: 1px solid white;
      background: #e4f0f8;
    }
    .broker-title:nth-child(2) { background: #fae6e6; }
    .broker-row {
      display: grid;
      grid-template-columns: 20px 1fr 60px;
      height: 15px;
      line-height: 15px;
      border-bottom: 1px solid white;
      background: #eaf3fb;
    }
    .broker-col.buy-side .broker-row { background: #fdeaea; }
    .summary {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      height: 15px;
      line-height: 15px;
      text-align: center;
      background: #dcefee;
      border-top: 1px solid white;
    }
    .summary-values {
      background: #eef7f7;
      color: #31515a;
      font-weight: 700;
    }
    .orders {
      border-top: 1px solid #d7dde1;
      background: #fbfcfd;
    }
    .orders-head {
      display: grid;
      grid-template-columns: 1fr 60px;
      align-items: center;
      min-height: 24px;
      padding: 3px 6px;
      background: #eef5f8;
      color: #36566b;
      font-weight: 700;
    }
    .orders-head button {
      height: 22px;
      border: 0;
      background: #6d7f8f;
      color: white;
      cursor: pointer;
      font-size: 12px;
    }
    .orders-list {
      min-height: 24px;
    }
    .order-row {
      display: grid;
      grid-template-columns: 44px 1fr 64px 64px 28px;
      align-items: center;
      height: 22px;
      border-top: 1px solid #edf0f2;
      padding: 0 4px;
    }
    .order-row.buy-order { background: #fff2f2; color: #9b3131; }
    .order-row.sell-order { background: #edf6ff; color: #175982; }
    .order-row button {
      height: 18px;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-weight: 700;
    }
    .orders-empty {
      height: 24px;
      line-height: 24px;
      padding: 0 6px;
      color: #888;
    }
    .chart-panel {
      border-top: 1px solid #cfcfcf;
      background: #fff;
    }
    .chart-head {
      display: grid;
      grid-template-columns: 1fr 72px 72px;
      gap: 4px;
      align-items: center;
      height: 30px;
      padding: 3px 4px;
      background: #eef5f8;
      border-bottom: 1px solid #d9e5ea;
    }
    .chart-head strong {
      padding-left: 4px;
      color: #36566b;
    }
    .chart-head select,
    .chart-head button {
      height: 24px;
      border: 1px solid #c8d8df;
      background: #fff;
      color: #36566b;
      font-size: 12px;
    }
    .chart-head button {
      background: #287bbe;
      color: white;
      border: 0;
      cursor: pointer;
      font-weight: 700;
    }
    .chart-wrap {
      position: relative;
      height: 210px;
      background: #fff;
    }
    #chartCanvas {
      display: block;
      width: 100%;
      height: 210px;
    }
    .chart-empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #999;
      pointer-events: none;
    }
    .status {
      padding: 5px 8px;
      color: #777;
      min-height: 24px;
      border-top: 1px solid #ddd;
    }
    @media (max-width: 520px) {
      .cell { padding: 0 2px; }
      .control-strip { padding: 4px; }
      .toolbar { grid-template-columns: 78px 34px 1fr 34px 34px 34px; }
    }

    /* Compact HTS-style quote board. The replay controls stay below the board. */
    body {
      background: #efefef;
      color: #303030;
      font-family: "Malgun Gothic", Arial, sans-serif;
    }
    .app {
      width: min(100vw, 374px);
      margin: 0 auto;
      border: 1px solid #aeb3b7;
      box-shadow: none;
      background: #fff;
    }
    .quote-window {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      width: 100%;
      background: #fff;
      border-bottom: 1px solid #6f757a;
    }
    .quote-main { min-width: 0; }
    .quote-head {
      display: grid;
      grid-template-columns: 272px minmax(0, 1fr);
      width: 100%;
      height: 20px;
      line-height: 19px;
      background: #ededed;
      border-bottom: 1px solid #8f9498;
      color: #222;
      text-align: center;
      font-size: 12px;
      overflow: hidden;
    }
    .quote-book-head {
      display: grid;
      grid-template-columns: 42px 50px 55px 45px 50px 30px;
      min-width: 0;
    }
    .quote-book-head > span {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      border-right: 1px solid #c6cacc;
    }
    .quote-stats-head {
      min-width: 0;
      border-left: 1px solid #8f9498;
      background: #ededed;
    }
    .quote-content {
      display: grid;
      grid-template-columns: 272px minmax(0, 1fr);
      align-items: stretch;
    }
    .quote-book {
      width: 272px;
      min-width: 0;
      background: #fff;
    }
    .quote-title {
      display: block;
      height: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }
    .quote-side {
      display: block;
      width: 272px;
      height: 160px;
      overflow: hidden;
      border: 0;
      background: #fff;
    }
    .quote-side.quote-bids {
      height: 160px;
      overflow: hidden;
      scrollbar-width: none;
      border-bottom: 1px solid #9ba1a5;
    }
    .quote-side.quote-bids::-webkit-scrollbar { display: none; }
    .quote-side.quote-bids .quote-row {
      width: 272px;
      grid-template-columns: 42px 50px 55px 45px 50px 30px;
    }
    .quote-row {
      display: grid;
      grid-template-columns: 42px 50px 55px 45px 50px 30px;
      width: 272px;
      height: 16px;
      line-height: 16px;
    }
    .quote-row .cell {
      width: auto;
      height: 16px;
      line-height: 16px;
      padding: 0 3px;
      border-right: 1px solid #e2e3e4;
      border-bottom: 1px solid #e4e5e6;
      font-size: 12px;
    }
    .quote-row.ask .cell { background: #eaf4fb; }
    .quote-row.bid .cell { background: #fff0f2; }
    .quote-row .quote-price {
      color: #f23846;
      font-weight: 400;
    }
    .quote-row.ask .quote-price { background: #dfeff9 !important; }
    .quote-row.bid .quote-price { background: #fde5e9 !important; }
    .quote-row .quote-rate { color: #f23846; }
    .quote-row .quote-delta { color: #f23846; }
    .depth-cell { position: relative; }
    .depth-cell .depth-bar {
      position: absolute;
      top: 1px;
      bottom: 1px;
      z-index: 0;
      pointer-events: none;
    }
    .depth-cell .depth-bar.ask { right: 0; background: #acd7ef; }
    .depth-cell .depth-bar.bid { left: 0; background: #f3b8c0; }
    .depth-cell .depth-label { position: relative; z-index: 1; }
    .quote-row.current .cell { background: #d9efff !important; }
    .quote-row.current .quote-price {
      outline: 1px solid #f23846;
      outline-offset: -1px;
      font-weight: 700;
    }
    .quote-stats {
      min-width: 0;
      min-height: 325px;
      overflow: hidden;
      border-left: 1px solid #9ba1a5;
      background: #fff;
    }
    .quote-stat-row {
      display: grid;
      grid-template-columns: 31px minmax(0, 1fr);
      height: 15px;
      line-height: 15px;
      border-bottom: 1px solid #e4e5e6;
      background: #fff;
      font-size: 12px;
    }
    .quote-stat-row span {
      padding-left: 3px;
      overflow: hidden;
      white-space: nowrap;
    }
    .quote-stat-row strong {
      padding-right: 3px;
      overflow: hidden;
      white-space: nowrap;
      text-align: right;
      font-weight: 400;
    }
    .quote-stat-group {
      height: 17px;
      line-height: 17px;
      padding: 0 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      color: #6d7174;
      background: #f4f2ec;
      border-bottom: 1px solid #d8dadb;
    }
    .quote-stat-row.stat-up strong { color: #f23846; }
    .quote-stat-row.stat-down strong { color: #2879c7; }
    .quote-stat-row.trade-volume-up strong { color: #f23846; font-weight: 700; }
    .quote-stat-row.trade-volume-down strong { color: #2879c7; font-weight: 700; }
    .quote-totals {
      display: grid;
      grid-template-columns: 90px 92px 90px;
      height: 18px;
      line-height: 17px;
      text-align: right;
      border-top: 1px solid #9ba1a5;
      border-bottom: 1px solid #d3d5d6;
      background: #fff;
      font-size: 12px;
    }
    .quote-totals span {
      padding: 0 3px;
      border-right: 1px solid #e2e3e4;
      overflow: hidden;
      white-space: nowrap;
    }
    .quote-totals .quote-net { color: #2879c7; text-align: center; }
    .quote-after {
      --sell-strength: 0%;
      --buy-strength: 0%;
      position: relative;
      display: grid;
      grid-template-columns: 90px 92px 90px;
      height: 26px;
      line-height: 23px;
      text-align: right;
      background: #fff;
      font-size: 12px;
    }
    .quote-after::before,
    .quote-after::after {
      position: absolute;
      bottom: 0;
      height: 3px;
      content: "";
    }
    .quote-after::before { left: 0; width: var(--sell-strength); background: #2879c7; }
    .quote-after::after { right: 0; width: var(--buy-strength); background: #ef3949; }
    .quote-after.no-strength::before,
    .quote-after.no-strength::after { display: none; }
    .quote-after > span,
    .quote-after > strong {
      padding: 0 3px;
      overflow: hidden;
      white-space: nowrap;
    }
    .quote-after > span:first-child { color: #2879c7; }
    .quote-after strong { text-align: center; font-weight: 400; }
    #speedLabel { display: none; }
    .toolbar {
      height: 30px;
      grid-template-columns: 92px 28px minmax(0, 1fr) 28px 28px 28px 28px;
      border-bottom: 1px solid #b5b9bb;
      background: #dedede;
    }
    .toolbar input {
      min-width: 0;
      padding: 0 5px;
      border-right: 1px solid #aeb3b7;
      background: #fff;
      color: #202020;
      font-size: 11px;
    }
    .toolbar .tool-btn {
      min-width: 0;
      padding: 0;
      border: 0;
      border-right: 1px solid #aeb3b7;
      background: #e7e7e7;
      color: #303030;
      font-size: 11px;
      font-weight: 400;
    }
    .toolbar .tool-btn:hover,
    .control-strip button:hover,
    .icon-btn:hover,
    .tab:hover,
    .size-strip button:hover,
    .orders-head button:hover,
    .chart-head button:hover {
      background: #d5e8f6;
    }
    .control-strip {
      grid-template-columns: 42px 38px 38px 28px minmax(32px, 1fr) 28px 38px 38px 42px;
      gap: 2px;
      padding: 3px;
      background: #efefef;
      border-bottom: 1px solid #9fa4a8;
    }
    .control-strip button {
      min-width: 0;
      height: 25px;
      padding: 0;
      border: 1px solid #9fa4a8;
      border-radius: 0;
      background: #e7e7e7;
      color: #202020;
      font-size: 10px;
      font-weight: 400;
    }
    .control-strip .play { background: #e4efe4; color: #185e2a; }
    .inputs {
      grid-template-columns: 92px minmax(0, 1fr) 26px 52px;
      gap: 2px;
      padding: 3px;
      background: #f3f3f3;
      border-bottom: 1px solid #aeb3b7;
    }
    .inputs input,
    .chip {
      min-width: 0;
      height: 24px;
      padding: 0 4px;
      border: 1px solid #aeb3b7;
      border-radius: 0;
      background: #fff;
      color: #303030;
      line-height: 22px;
      font-size: 11px;
    }
    .chip { background: #e7e7e7; }
    .trade {
      grid-template-columns: 30px 68px 34px 34px 46px minmax(0, 1fr) 44px;
      gap: 1px;
      padding: 3px;
      background: #efefef;
      border-bottom: 1px solid #aeb3b7;
    }
    .trade div,
    .trade button,
    .trade input {
      min-width: 0;
      height: 25px;
      padding: 0 3px;
      border: 1px solid #aeb3b7;
      border-radius: 0;
      line-height: 23px;
      font-size: 11px;
      overflow: hidden;
      white-space: nowrap;
    }
    .trade button { border: 1px solid #8d9296; }
    .buy { background: #e85b63 !important; color: #fff !important; }
    .sell { background: #357fc2 !important; color: #fff !important; }
    .tabbar {
      grid-template-columns: 26px 26px 26px minmax(0, 1fr) 34px 44px 28px minmax(48px, 1fr) 44px;
      gap: 2px;
      padding: 3px;
      background: #f3f3f3;
      border-bottom: 1px solid #aeb3b7;
    }
    .tabbar > * { min-width: 0; }
    .icon-btn,
    .tab,
    .qty,
    #sellButton {
      width: 100%;
      min-width: 0;
      height: 25px;
      padding: 0 2px;
      border: 1px solid #9fa4a8;
      border-radius: 0;
      font-size: 11px;
      overflow: hidden;
      white-space: nowrap;
    }
    .icon-btn,
    .tab {
      background: #e7e7e7;
      color: #303030;
      font-weight: 400;
    }
    .share { background: #e7e7e7; }
    .size-strip {
      gap: 2px;
      padding: 3px;
      background: #efefef;
      border-bottom: 1px solid #aeb3b7;
    }
    .size-strip button {
      height: 23px;
      padding: 0;
      border: 1px solid #9fa4a8;
      background: #e7e7e7;
      color: #303030;
      font-size: 11px;
      font-weight: 400;
    }
    .broker { border-top: 0; border-bottom: 1px solid #aeb3b7; }
    .broker-title { background: #e9f2f8; color: #303030; }
    .broker-title:nth-child(2) { background: #f8e9e9; }
    .summary { border-top: 0; background: #e6eeee; font-size: 11px; }
    .summary-values { background: #f2f7f7; }
    .orders { border-top: 0; }
    .orders-head {
      min-height: 25px;
      padding: 2px 3px;
      background: #e7e7e7;
      color: #303030;
      font-size: 11px;
    }
    .orders-head button {
      height: 21px;
      border: 1px solid #9fa4a8;
      background: #f4f4f4;
      color: #303030;
      font-size: 11px;
    }
    .chart-panel { border-top: 1px solid #8f9498; }
    .chart-head {
      grid-template-columns: minmax(0, 1fr) 66px 58px;
      gap: 2px;
      height: 27px;
      padding: 2px 3px;
      background: #e7e7e7;
      border-bottom: 1px solid #aeb3b7;
    }
    .chart-head strong { padding-left: 2px; color: #303030; }
    .chart-head select,
    .chart-head button {
      min-width: 0;
      height: 22px;
      border: 1px solid #9fa4a8;
      border-radius: 0;
      background: #f7f7f7;
      color: #303030;
      font-size: 11px;
      font-weight: 400;
    }
    .status {
      min-height: 22px;
      padding: 4px 5px;
      border-top: 1px solid #aeb3b7;
      background: #ededed;
      color: #444;
      font-size: 11px;
    }

    @media (max-width: 380px) {
      .app { width: 100%; }
      .quote-window { grid-template-columns: minmax(0, 1fr); }
      .quote-content { grid-template-columns: minmax(0, 1fr) 72px; }
      .quote-book, .quote-side, .quote-row { width: 100%; }
      .quote-row { grid-template-columns: 16% 18% 20% 16% 18% 12%; }
      .quote-side.quote-bids .quote-row { width: 100%; grid-template-columns: 16% 18% 20% 16% 18% 12%; }
      .quote-totals, .quote-after { grid-template-columns: 33.3% 33.4% 33.3%; }
      .quote-head { grid-template-columns: minmax(0, 1fr) 72px; }
      .quote-book-head { grid-template-columns: 16% 18% 20% 16% 18% 12%; }
      .tabbar { grid-template-columns: 24px 24px 24px minmax(0, 1fr) 32px 40px 26px minmax(42px, 1fr) 40px; }
      .trade { grid-template-columns: 28px 56px 32px 32px 42px minmax(0, 1fr) 40px; }
    }

    /* ---------- Editorial Paper pass ---------- */
    :root {
      --paper: #FAFAF7;
      --card: #FFFDF8;
      --paper-2: #F4EFE4;
      --ink: #101010;
      --muted: #6F6F6A;
      --muted-2: #8A8578;
      --line: #CFC9B8;
      --line-strong: #101010;
      --yellow: #F6C900;
      --marker: #FFD84D;
      --up: #B23A3A;
      --down: #33557F;
      --ask-tint: #E8ECF1;
      --bid-tint: #F6E9E2;
    }
    body {
      background: #E7E4DC;
      color: var(--ink);
      font-family: "Pretendard", "Malgun Gothic", Arial, sans-serif;
    }
    .app {
      background: var(--paper);
      border: 1.5px solid var(--ink);
      box-shadow: 8px 8px 0 rgba(16, 16, 16, .12);
    }
    .dateline {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 10px;
      background: var(--paper);
      border-bottom: 1px solid var(--ink);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .14em;
      color: var(--muted-2);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
    }
    .dateline span:nth-child(2) { letter-spacing: .04em; }
    @media (max-width: 520px) {
      .dateline span:nth-child(2) { display: none; }
    }
    .masthead {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px 8px;
      background: var(--card);
      border-bottom: 4px double var(--ink);
    }
    .masthead-title {
      font-family: "Noto Serif KR", "NanumMyeongjo", "Batang", "바탕", serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .02em;
      white-space: nowrap;
    }
    .masthead-title::before {
      content: "";
      display: inline-block;
      width: 9px;
      height: 9px;
      background: var(--yellow);
      margin-right: 7px;
      vertical-align: 1px;
    }

    /* ---------- bundle loader overlay ---------- */
    .bundle-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(231, 228, 220, .55);
      backdrop-filter: blur(8px) saturate(.85);
      -webkit-backdrop-filter: blur(8px) saturate(.85);
    }
    .bundle-loader[hidden] { display: none; }
    .bl-card {
      background: var(--paper);
      border: 1.5px solid var(--ink);
      box-shadow: 8px 8px 0 rgba(16, 16, 16, .14);
      padding: 28px 36px 24px;
      text-align: center;
      max-width: 360px;
      width: calc(100vw - 48px);
    }
    .bl-kicker {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .22em;
      color: var(--muted-2);
      margin-bottom: 8px;
    }
    .bl-title {
      font-family: "Noto Serif KR", "NanumMyeongjo", "Batang", "바탕", serif;
      font-size: 19px;
      font-weight: 900;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .bl-bar {
      height: 10px;
      border: 1.5px solid var(--ink);
      background: var(--card);
      overflow: hidden;
      position: relative;
    }
    .bl-bar i {
      position: absolute;
      top: 0; bottom: 0;
      width: 38%;
      left: -38%;
      background: var(--yellow);
      animation: blslide 1.15s cubic-bezier(.45,0,.55,1) infinite;
    }
    @keyframes blslide { to { left: 100%; } }
    .bl-mb {
      margin-top: 14px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      letter-spacing: .04em;
      min-height: 1em;
    }

    /* chrome strips: paper tones + ink rules */
    .toolbar { background: var(--paper-2); border-bottom: 2px solid var(--ink); }
    .toolbar input { background: var(--card); border-right: 1px solid var(--line); color: var(--ink); }
    .toolbar .tool-btn {
      background: var(--card);
      border-right: 1px solid var(--line);
      color: var(--ink);
      font-weight: 700;
    }
    .toolbar .tool-btn.blue,
    .toolbar .tool-btn.cyan,
    .toolbar .tool-btn.orange { background: var(--card); color: var(--ink); }
    .quote-window { border-bottom: 2px solid var(--ink); }
    .quote-head { background: var(--paper-2); border-bottom: 1px solid var(--line-strong); color: var(--ink); }
    .quote-book-head > span { border-right: 1px solid var(--line); font-weight: 700; }
    .quote-stats-head { border-left: 1px solid var(--line-strong); background: var(--paper-2); }

    /* order book cells */
    .quote-row .cell {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
    }
    .quote-row.ask .cell { background: var(--ask-tint); }
    .quote-row.bid .cell { background: var(--bid-tint); }
    .quote-row .quote-price { color: var(--up); }
    .quote-row.ask .quote-price { background: #D8E2EC !important; }
    .quote-row.bid .quote-price { background: #EFDCD3 !important; }
    .quote-row .quote-rate, .quote-row .quote-delta { color: var(--up); }
    .depth-cell .depth-bar.ask { background: #B7C6D4; }
    .depth-cell .depth-bar.bid { background: #DDB7AC; }
    .quote-row.current .cell { background: var(--marker) !important; }
    .quote-row.current .quote-price { outline: 1.5px solid var(--ink); outline-offset: -1.5px; font-weight: 700; }

    /* totals / after-hours / stats */
    .quote-totals {
      border-top: 1px solid var(--line-strong);
      border-bottom: 1px solid var(--line);
      background: var(--card);
    }
    .quote-totals span { border-right: 1px solid var(--line); }
    .quote-net { color: var(--down); }
    .quote-after { background: var(--card); }
    .quote-after::before { background: var(--down); }
    .quote-after::after { background: var(--up); }
    .quote-after > span:first-child { color: var(--down); }
    .quote-stat-row { border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
    .quote-stat-row strong { font-weight: 700; }
    .quote-stat-group {
      height: 18px;
      line-height: 18px;
      padding: 0 5px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .14em;
      color: var(--muted-2);
      background: var(--paper-2);
      border-bottom: 1px solid var(--line);
    }
    .quote-stat-row.stat-up strong { color: var(--up); }
    .quote-stat-row.stat-down strong { color: var(--down); }
    .quote-stat-row.trade-volume-up strong { color: var(--up); }
    .quote-stat-row.trade-volume-down strong { color: var(--down); }

    /* broker / summary / orders */
    .broker { border-bottom: 1px solid var(--line); }
    .broker-title { background: var(--ask-tint); color: var(--ink); border-bottom: 1px solid var(--line); }
    .broker-title:nth-child(2) { background: var(--bid-tint); }
    .broker-row { background: var(--ask-tint); border-bottom: 1px solid var(--line); }
    .broker-col.buy-side .broker-row { background: var(--bid-tint); }
    .summary { background: #E7E2D2; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; height: 24px; line-height: 24px; font-size: 12px; }
    .summary-values { background: #EFEADD; color: var(--ink); font-size: 14px; font-weight: 700; }
    .orders { background: var(--card); }
    .orders-head { background: var(--paper-2); color: var(--ink); border-bottom: 1px solid var(--line); }
    .orders-head button { background: var(--card); border: 1px solid var(--line-strong); color: var(--ink); }
    .order-row { border-top: 1px solid var(--line); }
    .order-row.buy-order { background: #F3E2DF; color: #7E2A24; }
    .order-row.sell-order { background: #E3EAF3; color: #2C4A73; }

    /* replay controls */
    .control-strip {
      background: var(--paper-2);
      border-bottom: 1px solid var(--line);
      gap: 2px;
    }
    .control-strip button {
      background: var(--card);
      border: 1px solid var(--line-strong);
      color: var(--ink);
      font-weight: 700;
    }
    .control-strip button:hover { background: var(--marker); }
    .control-strip .play { background: var(--yellow); color: var(--ink); }
    .control-strip .play:hover { background: var(--marker); }
    .inputs { background: var(--paper-2); border-bottom: 1px solid var(--line); }
    .inputs input, .chip { background: var(--card); border: 1px solid var(--line-strong); color: var(--ink); }
    .chip { background: var(--paper-2); }
    .trade { background: var(--paper-2); border-bottom: 1px solid var(--line); }
    .trade div, .trade button, .trade input {
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--ink);
    }
    .trade button { border: 1px solid var(--line-strong); }
    .buy { background: var(--up) !important; color: #FAFAF7 !important; }
    .sell { background: var(--down) !important; color: #FAFAF7 !important; }
    .tabbar { background: var(--paper-2); border-bottom: 1px solid var(--line); }
    .icon-btn, .tab, .qty, #sellButton {
      background: var(--card);
      border: 1px solid var(--line-strong);
      color: var(--ink);
    }
    .share { background: var(--card); }
    .size-strip { background: var(--paper-2); border-bottom: 1px solid var(--line); }
    .size-strip button { background: var(--card); border: 1px solid var(--line); color: var(--ink); }
    .size-strip button:hover { background: var(--marker); }
    /* chart */
    .chart-panel { border-top: 2px solid var(--ink); }
    .chart-head { background: var(--paper-2); border-bottom: 1px solid var(--line); }
    .chart-head strong {
      color: var(--ink);
      font-family: "Noto Serif KR", "NanumMyeongjo", "Batang", "바탕", serif;
      font-size: 13px;
      letter-spacing: .12em;
    }
    .chart-head select, .chart-head button {
      background: var(--card);
      border: 1px solid var(--line-strong);
      color: var(--ink);
    }
    .chart-head button { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 700; }
    .chart-wrap { background: var(--card); }
    #chartCanvas { background: var(--card); }
    .chart-empty { color: var(--muted-2); }

    /* status */
    .status {
      background: var(--paper-2);
      border-top: 1px solid var(--line-strong);
      color: var(--muted);
      font-size: 10.5px;
      letter-spacing: .02em;
    }

    /* ---------- 매물대 ---------- */
    .profile-panel {
      display: flex;
      flex-direction: column;
      background: var(--card);
      border-top: 2px solid var(--ink);
      min-height: 0;
    }
    .profile-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 5px 8px;
      background: var(--paper-2);
      border-bottom: 1px solid var(--line);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
    }
    .profile-sub { color: var(--muted); font-weight: 600; letter-spacing: .02em; }
    .profile-wrap { position: relative; height: 220px; background: var(--card); }
    #profileCanvas { display: block; width: 100%; height: 100%; }

    /* ---------- Desktop two-column layout ---------- */
    .cols { display: block; }
    .col { display: flex; flex-direction: column; }
    @media (min-width: 960px) {
      .app { width: min(100vw - 48px, 920px); }
      .cols { display: grid; grid-template-columns: 1.45fr 1fr; }
      .col-charts { border-left: 1.5px solid var(--ink); }
      .col-charts .chart-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .col-charts .chart-wrap { flex: 1; height: auto; min-height: 280px; }
      .col-charts #chartCanvas { height: 100%; }
      .quote-head, .quote-content { grid-template-columns: 336px minmax(0, 1fr); }
      .quote-book-head { grid-template-columns: 52px 62px 68px 56px 62px 36px; }
      .quote-book { width: 336px; }
      .quote-side { width: 336px; }
      .quote-side.quote-bids .quote-row,
      .quote-row { width: 336px; grid-template-columns: 52px 62px 68px 56px 62px 36px; }
      .quote-totals, .quote-after { grid-template-columns: 112px 112px 112px; }
    }
  </style>
</head>

  <script>
    const $ = (id) => document.getElementById(id);
    let state = {
      no: 0,
      timer: null,
      playBusy: false,
      symbols: [],
      symbolMap: new Map(),
      lastTrade: {},
      lastBook: {},
      lastAfter: {},
      lastBroker: {},
      currentEventTime: "",
      recentTrades: [],
      seenTradeNos: new Set(),
      executedBuyVolume: 0,
      executedSellVolume: 0,
      info: {},
      chartRows: [],
      speed: 1,
      orderPriceLocked: false,
      pendingOrders: [],
      nextOrderId: 1,
      initialJumpTime: "",
      position: { cash: 10000000, qty: 0, avg: 0, fee: 0, realized: 0 },
      localLines: null,
      localNos: null,
      localKey: "",
      localInfo: null,
      localLoading: null,
      localFailed: new Set()
    };

    // 브라우저·서버가 영어로 던진 오류는 그대로 보여 주지 않는다
    function errorText(err) {
      const msg = String((err && err.message) || "");
      return /[가-힣]/.test(msg) ? msg : "다시 시도해 주세요. 화면을 새로 고치면 대부분 해결됩니다.";
    }

    function fmt(v) {
      if (v === undefined || v === null || v === "") return "";
      const n = Number(String(v).replace(/^\+/, ""));
      if (Number.isFinite(n)) return n.toLocaleString("ko-KR");
      return v;
    }

    function clockText(value) {
      const raw = String(value ?? "").trim();
      if (!raw) return "16:00:01";
      if (raw.includes(":")) return raw.slice(0, 8);
      const digits = raw.replace(/\D/g, "");
      if (digits.length === 8) {
        const shortMinute = Number(digits.slice(1, 3));
        if (shortMinute <= 59) return `${digits.slice(0, 1).padStart(2, "0")}:${digits.slice(1, 3)}:${digits.slice(3, 5)}`;
        return `${digits.slice(0, 2)}:${digits.slice(2, 4)}:${digits.slice(4, 6)}`;
      }
      if (digits.length >= 9) return `${digits.slice(0, 2)}:${digits.slice(2, 4)}:${digits.slice(4, 6)}`;
      if (digits.length >= 6) return `${digits.slice(-6, -4)}:${digits.slice(-4, -2)}:${digits.slice(-2)}`;
      return raw;
    }

    function num(v) {
      const n = Number(String(v ?? "").replace(/,/g, "").replace(/^\+/, ""));
      return Number.isFinite(n) ? n : 0;
    }

    function cell(text = "", cls = "") {
      const div = document.createElement("div");
      div.className = `cell ${cls}`;
      div.textContent = text;
      return div;
    }

    function priceCell(price, cls) {
      const div = cell(fmt(price), `${cls} price`);
      if (price !== undefined && price !== null && price !== "") {
        div.dataset.price = String(price);
        div.title = "클릭해서 주문 가격 입력";
      }
      return div;
    }

    function quantityCell(value, side, maximum) {
      const quantity = Math.max(0, num(value));
      const div = cell("", `${side} quote-qty depth-cell`);
      const bar = document.createElement("span");
      bar.className = `depth-bar ${side}`;
      bar.style.width = `${maximum > 0 ? Math.min(100, quantity / maximum * 100) : 0}%`;
      const label = document.createElement("span");
      label.className = "depth-label";
      label.textContent = fmt(value);
      div.append(bar, label);
      return div;
    }

    function latest(events, type) {
      for (let i = events.length - 1; i >= 0; i--) if (events[i].event_type === type) return events[i];
      return {};
    }

    function marketName(kind) {
      const value = String(kind ?? "");
      if (value === "10") return "KOSDAQ";
      if (value === "0") return "KOSPI";
      return value || "-";
    }

    function renderTop(info, trade) {

        ? Number(rawRate)
        : (current && prev ? (diff / prev) * 100 : 0);
      const identity = [info.code, info.name].filter(Boolean).join(" ");

      const statRows = [
        ["__group", "시세"],
        ["시가", info.open, "stat-up"],
        ["고가", info.high, "stat-up"],

        ["상한", info.upper_limit, "stat-up"],

        ["PER", info.per],
        ["PBR", info.pbr],
        ["ROE", info.roe],
        ["__group", "수급"],
        ["외인", state.lastBroker.foreign_net_buy_estimate],

      ];
      state.recentTrades.slice().reverse().forEach((item, index) => {
        const volume = num(item.volume);

    function renderBook(book) {
      const asks = $("asks");
      const bids = $("bids");
      asks.innerHTML = "";
      bids.innerHTML = "";
      const current = num(state.lastTrade.price) || num(book.bid_price_1) || num(book.ask_price_1);
      const askMax = Math.max(1, ...Array.from({ length: 10 }, (_, index) => num(book[`ask_qty_${index + 1}`])));
      const bidMax = Math.max(1, ...Array.from({ length: 10 }, (_, index) => num(book[`bid_qty_${index + 1}`])));
      const rateText = (price) => {
        const numeric = num(price);
        if (!numeric || !current) return "";
        return `${((numeric - current) / current * 100).toFixed(2)}`;
      };
      const addRow = (root, side, level) => {
        const price = book[`${side}_price_${level}`];
        const askPrice = book[`ask_price_${level}`];
        const bidPrice = book[`bid_price_${level}`];
        const row = document.createElement("div");
        row.className = `quote-row ${side}`;
        if (current && (num(price) === current || (side === "bid" && num(askPrice) === current))) row.classList.add("current");
        const delta = cell(fmt(book[`${side}_delta_${level}`]), `${side} quote-delta`);
        const quantity = quantityCell(book[`${side}_qty_${level}`], side, side === "ask" ? askMax : bidMax);
        const priceValue = priceCell(price, `${side} quote-price`);
        const rate = cell(rateText(price), `${side} quote-rate`);
        const emptyLeft = cell("", `${side} quote-empty`);
        const emptyRight = cell("", `${side} quote-empty`);
        if (side === "ask") row.append(delta, quantity, priceValue, rate, emptyLeft, emptyRight);
        else {
          const bidPriceValue = priceCell(bidPrice, "bid quote-price");
          const bidRate = cell(rateText(bidPrice), "bid quote-rate");
          const bidQuantity = quantityCell(book[`bid_qty_${level}`], "bid", bidMax);
          const bidDelta = cell(fmt(book[`bid_delta_${level}`]), "bid quote-delta");
          row.append(emptyLeft, emptyRight, bidPriceValue, bidRate, bidQuantity, bidDelta);
        }
        root.append(row);
      };
      for (let level = 10; level >= 1; level--) {
        addRow(asks, "ask", level);
      }
      for (let level = 1; level <= 10; level++) {
        addRow(bids, "bid", level);

    function renderQuoteTotals(book, after) {
      const askTotal = Array.from({ length: 10 }, (_, index) => num(book[`ask_qty_${index + 1}`])).reduce((sum, value) => sum + value, 0);
      const bidTotal = Array.from({ length: 10 }, (_, index) => num(book[`bid_qty_${index + 1}`])).reduce((sum, value) => sum + value, 0);
      $("quoteAskTotal").textContent = fmt(askTotal);
      $("quoteNetTotal").textContent = fmt(bidTotal - askTotal);
      $("quoteBidTotal").textContent = fmt(bidTotal);
      $("quoteAfterValue").textContent = fmt(after?.after_sell_total) || "";
      $("quoteAfterRight").textContent = fmt(after?.after_buy_total) || "";
      const strength = document.querySelector(".quote-after");
      const buyVolume = state.executedBuyVolume;
      const sellVolume = state.executedSellVolume;
      const executedTotal = buyVolume + sellVolume;
      if (buyVolume > 0 && sellVolume > 0) {
        const buyRatio = buyVolume / executedTotal * 100;
        const sellRatio = 100 - buyRatio;
        const tradeStrength = buyVolume / sellVolume * 100;
        strength.classList.remove("no-strength");
        strength.style.setProperty("--buy-strength", `${buyRatio}%`);
        strength.style.setProperty("--sell-strength", `${sellRatio}%`);
        strength.title = `체결강도 ${tradeStrength.toFixed(1)}% · 매수 체결 ${buyRatio.toFixed(1)}% · 매도 체결 ${sellRatio.toFixed(1)}%`;
      } else {
        strength.classList.add("no-strength");
        strength.style.setProperty("--buy-strength", "0%");
        strength.style.setProperty("--sell-strength", "0%");
        strength.removeAttribute("title");
      }
    }

    function resetRuntimeState() {
      state.no = 0;
      state.lastTrade = {};
      state.lastBook = {};
      state.lastAfter = {};
      state.lastBroker = {};
      state.currentEventTime = "";
      state.recentTrades = [];
      state.seenTradeNos = new Set();
      state.executedBuyVolume = 0;
      state.executedSellVolume = 0;
      state.orderPriceLocked = false;
      state.pendingOrders = [];
      state.nextOrderId = 1;
      state.position = { cash: 10000000, qty: 0, avg: 0, fee: 0, realized: 0 };
    }

    function mergeLatest(events) {
      events.forEach((event) => {
        if (event.event_type === "1") {
          state.lastTrade = event;
          const tradeKey = `${event.date}/${event.code}/${event.no}`;
          if (!state.seenTradeNos.has(tradeKey) && event.trade_volume !== undefined && event.trade_volume !== null && event.trade_volume !== "") {
            state.seenTradeNos.add(tradeKey);
            const volume = num(event.trade_volume);
            if (volume > 0) state.executedBuyVolume += volume;
            if (volume < 0) state.executedSellVolume += Math.abs(volume);
            state.recentTrades.push({ no: event.no, time: event.time, volume: event.trade_volume });
            if (state.recentTrades.length > 10) state.recentTrades.shift();
          }
        }
        if (event.event_type === "2") state.lastBook = event;
        if (event.event_type === "3") state.lastAfter = event;
        if (event.event_type === "4") state.lastBroker = event;
      });
    }

    function currentPrice() {
      return num(state.lastTrade.price) || num(state.lastBook.bid_price_1) || num(state.lastBook.ask_price_1) || num($("priceInput")?.value);
    }

    function lrsSlope(rows) {
      const n = rows.length;
      if (n < 2) return null;
      const meanX = (n - 1) / 2;
      const meanY = rows.reduce((sum, row) => sum + num(row.close), 0) / n;
      let nume = 0;
      let deno = 0;
      rows.forEach((row, index) => {
        nume += (index - meanX) * (num(row.close) - meanY);
        deno += (index - meanX) ** 2;
      });
      return deno ? nume / deno : null;
    }

    function speedText() {
      return `${Number.isInteger(state.speed) ? state.speed.toFixed(0) : state.speed}배`;
    }

    function updateSpeedUi() {
      $("speedLabel").textContent = speedText();
      $("speedChip").textContent = speedText();
    }

    function stopPlayback() {
      if (state.timer) {
        clearInterval(state.timer);
        state.timer = null;
      }
      $("play").textContent = "재생";
      $("play").title = "재생";
    }

    function playIntervalMs() {
      return Math.max(80, Math.round(1200 / state.speed));
    }

    function startPlayback() {
      stopPlayback();
      $("play").textContent = "정지";
      $("play").title = "일시정지";
      state.timer = setInterval(() => {
        if (state.playBusy) return;
        state.playBusy = true;
        load(1000, false, true)
          .then((eventCount) => {
            if (!eventCount) {
              $("status").textContent = "마지막 장면입니다";
              stopPlayback();
            }
          })
          .catch((err) => {
            $("status").textContent = errorText(err);
            stopPlayback();
          })
          .finally(() => {
            state.playBusy = false;
          });
      }, playIntervalMs());
    }

    function cycleSpeed() {
      const speeds = [0.25, 0.5, 1, 2, 4, 8];
      const current = speeds.indexOf(state.speed);
      state.speed = speeds[(current + 1) % speeds.length];
      updateSpeedUi();
      $("status").textContent = `재생 속도 ${speedText()}`;
      if (state.timer) startPlayback();
    }

    function selectOrderPrice(rawPrice) {
      const price = num(rawPrice);
      if (!price) return;
      $("priceInput").value = fmt(price);
      state.orderPriceLocked = true;
      $("status").textContent = `지정가 ${fmt(price)} 선택`;
    }

    function updatePortfolio() {
      $("asset").textContent = fmt(Math.round(state.position.cash));
      const mark = currentPrice();
      const holdingCost = state.position.avg * state.position.qty;
      const holdingValue = state.position.qty * mark;
      const evalAsset = state.position.cash + holdingValue;
      const unrealized = state.position.qty ? (mark - state.position.avg) * state.position.qty : 0;
      $("baseAsset").textContent = fmt(Math.round(holdingCost));
      $("evalAsset").textContent = fmt(Math.round(evalAsset));
      $("feeSum").textContent = fmt(Math.round(state.position.fee));
      $("realizedProfit").textContent = fmt(Math.round(state.position.realized));
      $("unrealizedProfit").textContent = fmt(Math.round(unrealized));
      $("profitRate").textContent = `${((evalAsset - 10000000) / 10000000 * 100).toFixed(2)}%`;
      $("holding").textContent = `보유 ${fmt(state.position.qty)}`;
      renderOrders();
    }

    function orderPrice() {
      return num($("priceInput").value) || currentPrice();
    }

    function applySizePercent(percent) {
      const price = orderPrice();
      if (!price) {
        $("status").textContent = "수량 계산할 가격이 없습니다";
        return;
      }
      const budget = state.position.cash * (percent / 100);
      const qty = Math.floor(budget / (price * 1.0021));
      $("qtyInput").value = String(Math.max(0, qty));
      $("status").textContent = `${percent}% 수량 ${fmt(qty)}주 · 한 주 ${fmt(price)}원`;
    }

    function renderOrders() {
      $("ordersTitle").textContent = `대기 주문 ${state.pendingOrders.length}건`;
      const root = $("ordersList");
      root.innerHTML = "";
      if (!state.pendingOrders.length) {
        root.innerHTML = '<div class="orders-empty">대기 주문 없음</div>';
        return;
      }
      state.pendingOrders.forEach((order) => {
        const row = document.createElement("div");
        row.className = `order-row ${order.side === "buy" ? "buy-order" : "sell-order"}`;
        row.innerHTML = `
          <div>${order.side === "buy" ? "매수" : "매도"}</div>
          <div>${fmt(order.qty)}주</div>
          <div>${fmt(order.price)}</div>
          <div>${order.side === "buy" ? "이하" : "이상"}</div>
          <button type="button" data-cancel-order="${order.id}" title="주문 취소">×</button>
        `;
        root.append(row);
      });
    }

    function pendingBuyCommit() {
      return state.pendingOrders
        .filter((order) => order.side === "buy")
        .reduce((sum, order) => sum + order.price * order.qty * 1.0021, 0);
    }

    function pendingSellQty() {
      return state.pendingOrders
        .filter((order) => order.side === "sell")
        .reduce((sum, order) => sum + order.qty, 0);
    }

    function executeOrder(side, qty, price) {
      const feeRate = 0.0021;
      const gross = price * qty;
      const fee = gross * feeRate;
      if (side === "buy") {
        if (state.position.cash < gross + fee) return false;
        const prevCost = state.position.avg * state.position.qty;
        state.position.cash -= gross + fee;
        state.position.qty += qty;
        state.position.avg = (prevCost + gross) / state.position.qty;
        state.position.fee += fee;
      } else {
        if (state.position.qty < qty) return false;
        state.position.cash += gross - fee;
        state.position.qty -= qty;
        state.position.realized += (price - state.position.avg) * qty - fee;
        state.position.fee += fee;
        if (state.position.qty === 0) state.position.avg = 0;
      }
      return true;
    }

    function addPendingOrder(side, qty, price) {
      if (side === "buy") {
        const needed = price * qty * 1.0021;
        if (state.position.cash - pendingBuyCommit() < needed) {
          $("status").textContent = "대기 주문 포함 현금이 부족합니다";
          return;
        }
      } else if (state.position.qty - pendingSellQty() < qty) {
        $("status").textContent = "대기 주문 포함 보유 수량이 부족합니다";
        return;
      }
      state.pendingOrders.push({ id: state.nextOrderId++, side, qty, price, createdNo: Number($("no").value || state.no || 0) });
      $("status").textContent = `${side === "buy" ? "매수" : "매도"} 대기 ${fmt(qty)}주 · ${fmt(price)}원`;
      renderOrders();
    }

    function processPendingOrders(events) {
      const fills = [];
      const trades = events
        .filter((event) => event.event_type === "1" && num(event.price))
        .map((event) => ({ price: num(event.price), no: Number(event.no || 0), time: event.time || "" }));
      if (!trades.length || !state.pendingOrders.length) return fills;

      for (const trade of trades) {
        const remaining = [];
        for (const order of state.pendingOrders) {
          if (trade.no && order.createdNo && trade.no <= order.createdNo) {
            remaining.push(order);
            continue;
          }
          const touched = order.side === "buy" ? trade.price <= order.price : trade.price >= order.price;
          if (touched && executeOrder(order.side, order.qty, trade.price)) {
            fills.push(`${order.side === "buy" ? "매수" : "매도"} 체결 ${fmt(order.qty)}주 · ${fmt(trade.price)}원`);
          } else {
            remaining.push(order);
          }
        }
        state.pendingOrders = remaining;
        if (!state.pendingOrders.length) break;
      }
      return fills;
    }

    function order(side) {
      const qty = Math.max(1, Math.floor(num($("qtyInput").value) || 1));
      const manualPrice = num($("priceInput").value);
      const price = orderPrice();
      if (!price) {
        $("status").textContent = "가격이 없어 주문을 처리할 수 없습니다";
        return;
      }
      if (manualPrice && state.orderPriceLocked) {
        addPendingOrder(side, qty, price);
        updatePortfolio();
        return;
      }
      if (!executeOrder(side, qty, price)) {
        $("status").textContent = side === "buy" ? "현금이 부족합니다" : "보유 수량이 부족합니다";
        return;
      }
      $("status").textContent = `${side === "buy" ? "매수" : "매도"} 체결 ${fmt(qty)}주 · ${fmt(price)}원`;
      updatePortfolio();
    }

    function resolveCode() {
      const raw = $("code").value.trim();
      if (!raw) return "451060";
      if (state.symbolMap.has(raw)) return state.symbolMap.get(raw);
      const lower = raw.toLowerCase();
      const exact = state.symbols.find((item) => item.code === raw || item.codeName.toLowerCase() === lower);
      if (exact) return exact.code;
      const partial = state.symbols.find((item) => item.codeName.toLowerCase().includes(lower) || item.name.toLowerCase().includes(lower));
      if (partial) {
        $("code").value = partial.codeName;
        return partial.code;
      }
      return raw.split(" ")[0];
    }

    async function loadReplayDates() {
      const res = await fetch("api/dates");
      const dates = await res.json();
      if (!res.ok || !Array.isArray(dates) || !dates.length) throw new Error("받아 둔 날짜가 없습니다. 먼저 데이터를 받아 주세요");
      const current = $("date").value.replaceAll("-", "");
      $("date").min = dateInputValue(dates[0]);
      $("date").max = dateInputValue(dates[dates.length - 1]);
      if (!dates.includes(current)) $("date").value = dateInputValue(dates[dates.length - 1]);
      $("status").textContent = `받아 둔 거래일 ${dates.length.toLocaleString("ko-KR")}개`;
    }

    async function loadSymbols() {
      const date = $("date").value.replaceAll("-", "");
      const res = await fetch(`player/name.php?date=${encodeURIComponent(date)}`);
      if (!res.ok) throw new Error("종목 목록을 불러오지 못했습니다");
      const text = await res.text();
      const list = $("symbolList");
      list.innerHTML = "";
      state.symbols = [];
      state.symbolMap = new Map();
      text.trim().split(/\n+/).forEach((line) => {
        const codeName = line.split("\t")[0] || "";
        if (!codeName) return;
        const parts = codeName.split(" ");
        const code = parts.shift() || "";
        const name = parts.join(" ");
        state.symbols.push({ code, name, codeName });
        state.symbolMap.set(codeName, code);
        state.symbolMap.set(code, code);
        const option = document.createElement("option");
        option.value = codeName;
        list.append(option);
      });
      if (state.symbols.length && !state.symbolMap.has($("code").value.trim())) {
        $("code").value = state.symbols[0].codeName;
      }
      $("status").textContent = `${date} 종목 ${state.symbols.length.toLocaleString("ko-KR")}개`;
    }

    function parseChart(text) {
      return text.trim().split(/\n+/).map((line) => {
        const p = line.split("\t");
        return {
          stamp: Number(p[0]),
          label: p[1] || "",
          open: Number(p[2]),
          close: Number(p[3]),
          high: Number(p[4]),
          low: Number(p[5]),
          buyVolume: Number(p[6]),
          sellVolume: Number(p[7]),
          neutralVolume: Number(p[8]),
          maxNo: Number(p[9]),
          minNo: Number(p[10])
        };
      }).filter((d) => Number.isFinite(d.open) && Number.isFinite(d.close)).sort((a, b) => a.stamp - b.stamp);
    }

    function eventTimeToChartStamp(value) {
      const digits = String(value ?? "").replace(/\D/g, "").padStart(9, "0");
      if (!digits.trim()) return 0;
      const hour = Number(digits.slice(0, 2));
      const minute = Number(digits.slice(2, 4));
      const second = Number(digits.slice(4, 6));
      const millis = Number(digits.slice(6, 9));
      return ((hour * 60 + minute) * 60 + second) * 1000 + millis;
    }

    function chartRowsAtCurrentTime() {
      const currentStamp = eventTimeToChartStamp(state.currentEventTime);
      if (!currentStamp) return state.chartRows;
      return state.chartRows.filter((row) => row.stamp <= currentStamp);
    }

    function chartTimeLabel(label) {
      const text = String(label ?? "");
      if (text.includes(":")) return text.slice(0, 5);
      const digits = text.replace(/\D/g, "");
      return digits.length >= 4 ? `${digits.slice(0, 2)}:${digits.slice(2, 4)}` : text;
    }

    function drawChart(rows) {
      drawProfile(state.chartRows);
      const canvas = $("chartCanvas");
      const empty = $("chartEmpty");
      if (!rows.length) {
        empty.style.display = "grid";
        return;
      }
      empty.style.display = "none";
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * ratio));
      canvas.height = Math.max(1, Math.floor(rect.height * ratio));
      const ctx = canvas.getContext("2d");
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      const w = rect.width;
      const h = rect.height;
      ctx.clearRect(0, 0, w, h);

      const UP = "#B23A3A";
      const DOWN = "#33557F";
      const MUTED = "#8A8578";
      const GRID = "#E6E0D1";
      const HAIR = "#CFC9B8";
      const PAPER = "#FAFAF7";
      const FONT = '10px "Pretendard", "Malgun Gothic", Arial, sans-serif';

      const pad = { top: 12, right: 56, bottom: 30, left: 6 };
      const plotW = w - pad.left - pad.right;
      const plotH = h - pad.top - pad.bottom;
      const priceH = plotH * 0.74;
      const volTop = pad.top + priceH + plotH * 0.05;
      const volH = plotH * 0.21;

      const priceMin = Math.min(...rows.map((r) => r.low));
      const priceMax = Math.max(...rows.map((r) => r.high));
      const pSpan = Math.max(1, priceMax - priceMin);
      const pLo = priceMin - pSpan * 0.07;
      const pHi = priceMax + pSpan * 0.07;
      const y = (price) => pad.top + ((pHi - price) / (pHi - pLo)) * priceH;
      const xStep = plotW / rows.length;
      const candleW = Math.max(1.5, Math.min(12, xStep * 0.6));
      const cx = (i) => pad.left + i * xStep + xStep / 2;

      ctx.font = FONT;
      ctx.textBaseline = "middle";
      for (let i = 0; i <= 5; i++) {
        const yy = pad.top + (priceH * i) / 5;
        const price = pHi - ((pHi - pLo) * i) / 5;
        ctx.strokeStyle = GRID;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(pad.left, yy);
        ctx.lineTo(pad.left + plotW, yy);
        ctx.stroke();
        ctx.fillStyle = MUTED;
        ctx.textAlign = "left";
        ctx.fillText(fmt(Math.round(price)), pad.left + plotW + 5, yy);
      }
      ctx.strokeStyle = HAIR;
      ctx.beginPath();
      ctx.moveTo(pad.left, pad.top);
      ctx.lineTo(pad.left, pad.top + plotH);
      ctx.lineTo(pad.left + plotW, pad.top + plotH);
      ctx.stroke();

      let cumPV = 0;
      let cumV = 0;
      const vwap = rows.map((r) => {
        const volume = r.buyVolume + r.sellVolume + r.neutralVolume;
        const typical = (r.high + r.low + r.close) / 3;
        cumPV += typical * volume;
        cumV += volume;
        return cumV ? cumPV / cumV : typical;
      });
      const drawLine = (values, color, dash = []) => {
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.setLineDash(dash);
        ctx.beginPath();
        let pen = false;
        values.forEach((value, i) => {
          if (value === null || value === undefined || !Number.isFinite(value)) {
            pen = false;
            return;
          }
          const xx = cx(i);
          const yy = y(value);
          if (pen) ctx.lineTo(xx, yy);
          else ctx.moveTo(xx, yy);
          pen = true;
        });
        ctx.stroke();
        ctx.setLineDash([]);
      };
      drawLine(vwap, "#6F6F6A", [4, 3]);
      const ma = (period) => rows.map((r, i) => {
        if (i < period - 1) return null;
        let sum = 0;
        for (let j = i - period + 1; j <= i; j++) sum += rows[j].close;
        return sum / period;
      });
      drawLine(ma(5), UP);
      drawLine(ma(20), DOWN);

      const volMax = Math.max(1, ...rows.map((r) => r.buyVolume + r.sellVolume + r.neutralVolume));
      rows.forEach((r, i) => {
        const x = cx(i);
        const up = r.close >= r.open;
        const color = up ? UP : DOWN;
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, y(r.high));
        ctx.lineTo(x, y(r.low));
        ctx.stroke();
        const top = y(Math.max(r.open, r.close));
        const bottom = y(Math.min(r.open, r.close));
        ctx.fillStyle = color;
        ctx.fillRect(x - candleW / 2, top, candleW, Math.max(1, bottom - top));

        const volume = r.buyVolume + r.sellVolume + r.neutralVolume;
        const vh = (volume / volMax) * volH;
        if (vh > 0.5) {
          ctx.fillStyle = up ? "rgba(178,58,58,.4)" : "rgba(51,85,127,.4)";
          ctx.fillRect(x - candleW / 2, volTop + volH - vh, candleW, vh);
        }
      });

      const last = rows[rows.length - 1];
      const prevClose = rows.length > 1 ? rows[rows.length - 2].close : last.open;
      const lastColor = last.close >= prevClose ? UP : DOWN;
      const lastY = Math.min(Math.max(y(last.close), pad.top + 7), pad.top + priceH - 7);
      ctx.strokeStyle = lastColor;
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 2]);
      ctx.beginPath();
      ctx.moveTo(pad.left, y(last.close));
      ctx.lineTo(pad.left + plotW, y(last.close));
      ctx.stroke();
      ctx.setLineDash([]);
      const lastText = fmt(last.close);
      ctx.font = `bold ${FONT}`;
      const tagW = ctx.measureText(lastText).width + 10;
      ctx.fillStyle = lastColor;
      ctx.fillRect(pad.left + plotW + 1, lastY - 7, tagW, 14);
      ctx.fillStyle = PAPER;
      ctx.textAlign = "center";
      ctx.fillText(lastText, pad.left + plotW + 1 + tagW / 2, lastY);
      ctx.textAlign = "left";

      ctx.strokeStyle = HAIR;
      ctx.beginPath();
      ctx.moveTo(pad.left, volTop + volH);
      ctx.lineTo(pad.left + plotW, volTop + volH);
      ctx.stroke();

      ctx.fillStyle = MUTED;
      ctx.font = FONT;
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      const TICKS = 5;
      const used = new Set();
      for (let i = 0; i < TICKS; i++) {
        const idx = Math.round((i * (rows.length - 1)) / (TICKS - 1));
        if (used.has(idx)) continue;
        used.add(idx);
        ctx.fillText(chartTimeLabel(rows[idx].label), cx(idx), h - 9);
      }
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
    }

    function drawProfile(rows) {
      const canvas = $("profileCanvas");
      if (!canvas) return;
      const panel = canvas.closest(".profile-panel");
      if (!rows || rows.length < 2) {
        if (panel) panel.style.display = "none";
        return;
      }
      if (panel) panel.style.display = "";
      const sub = $("profileSub");
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * ratio));
      canvas.height = Math.max(1, Math.floor(rect.height * ratio));
      const ctx = canvas.getContext("2d");
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      const w = rect.width;
      const h = rect.height;
      ctx.clearRect(0, 0, w, h);

      const BINS = 22;
      const UP = "#B23A3A";
      const DOWN = "#33557F";
      const NEUTRAL = "#B9AE97";
      const INK = "#101010";
      const MUTED = "#8A8578";
      const pad = { left: 4, right: 56, top: 8, bottom: 8 };
      const plotW = w - pad.left - pad.right;
      const plotH = h - pad.top - pad.bottom;
      const binH = plotH / BINS;

      const pMin = Math.min(...rows.map((r) => r.low));
      const pMax = Math.max(...rows.map((r) => r.high));
      const span = Math.max(1, pMax - pMin);
      const lo = pMin - span * 0.04;
      const hi = pMax + span * 0.04;

      const bins = Array.from({ length: BINS }, () => ({ buy: 0, sell: 0, neutral: 0, total: 0 }));
      rows.forEach((r) => {
        const buy = num(r.buyVolume);
        const sell = num(r.sellVolume);
        const neutral = num(r.neutralVolume);
        const volume = buy + sell + neutral;
        if (!volume) return;
        const range = r.high - r.low;
        if (range <= 0) {
          const b = Math.min(BINS - 1, Math.max(0, Math.floor(((hi - r.close) / (hi - lo)) * BINS)));
          bins[b].buy += buy;
          bins[b].sell += sell;
          bins[b].neutral += neutral;
          bins[b].total += volume;
          return;
        }
        for (let b = 0; b < BINS; b++) {
          const bHi = hi - ((hi - lo) * b) / BINS;
          const bLo = hi - ((hi - lo) * (b + 1)) / BINS;
          const overlap = Math.min(r.high, bHi) - Math.max(r.low, bLo);
          if (overlap <= 0) continue;
          const weight = overlap / range;
          bins[b].buy += buy * weight;
          bins[b].sell += sell * weight;
          bins[b].neutral += neutral * weight;
          bins[b].total += volume * weight;
        }
      });

      let poc = 0;
      let maxVol = 0;
      bins.forEach((bin, i) => {
        if (bin.total > maxVol) {
          maxVol = bin.total;
          poc = i;
        }
      });
      const volScale = plotW / Math.max(1, maxVol);
      const barFont = '9px "Pretendard", "Malgun Gothic", Arial, sans-serif';
      const pocFont = 'bold 9px "Pretendard", "Malgun Gothic", Arial, sans-serif';

      ctx.textBaseline = "middle";
      bins.forEach((bin, i) => {
        const cy = pad.top + i * binH + binH / 2;
        const bh = Math.max(1, binH - 2.5);
        let x = pad.left;
        const wSell = bin.sell * volScale;
        const wNeutral = bin.neutral * volScale;
        const wBuy = bin.buy * volScale;
        if (wSell > 0.4) {
          ctx.fillStyle = DOWN;
          ctx.fillRect(x, cy - bh / 2, wSell, bh);
        }
        x += wSell;
        if (wNeutral > 0.4) {
          ctx.fillStyle = NEUTRAL;
          ctx.fillRect(x, cy - bh / 2, wNeutral, bh);
        }
        x += wNeutral;
        if (wBuy > 0.4) {
          ctx.fillStyle = UP;
          ctx.fillRect(x, cy - bh / 2, wBuy, bh);
        }
        const price = hi - ((hi - lo) * (i + 0.5)) / BINS;
        ctx.font = i === poc ? pocFont : barFont;
        ctx.fillStyle = i === poc ? INK : MUTED;
        ctx.textAlign = "left";
        ctx.fillText(fmt(Math.round(price)), pad.left + plotW + 5, cy);
      });

      if (sub) {
        const pocPrice = hi - ((hi - lo) * (poc + 0.5)) / BINS;
        sub.textContent = `거래가 가장 많았던 가격 ${fmt(Math.round(pocPrice))}원`;
      }
    }

    async function loadChart(date, code) {
      const time = $("time").value || "90000000";
      const gap = $("chartGap").value;
      const res = await fetch(`player/chart.php?date=${encodeURIComponent(date)}&code=${encodeURIComponent(code)}&time=${encodeURIComponent(time)}&bong=1&gap=${encodeURIComponent(gap)}`);
      if (!res.ok) throw new Error("차트를 불러오지 못했습니다");

      drawChart(chartRowsAtCurrentTime());
    }

    function dateInputValue(value) {
      const text = String(value || "").replaceAll("-", "");
      return text.length === 8 ? `${text.slice(0, 4)}-${text.slice(4, 6)}-${text.slice(6, 8)}` : "";
    }

    function applyInitialUrlParams() {
      const params = new URLSearchParams(window.location.search);
      const date = dateInputValue(params.get("date") || params.get("d"));
      const code = params.get("code") || params.get("c");
      const no = params.get("no");

    async function jumpToTime(date, code, timeText, direction = "forward") {
      $("status").textContent = `${timeText} 시점으로 이동 중...`;
      const res = await fetch(`api/time-index?date=${encodeURIComponent(date)}&code=${encodeURIComponent(code)}&time=${encodeURIComponent(timeText)}&direction=${encodeURIComponent(direction)}`);
      const data = await res.json();
