    async function loadAtTime(timeText, direction = "forward") {
      const date = $("date").value.replaceAll("-", "");
      const code = resolveCode();
      await ensureLocalEvents(date, code);
      const target = await jumpToTime(date, code, timeText, direction);
      const eventNo = Math.max(1, Number(target.event_no || 1));
      const warmupNo = Math.max(0, eventNo - 500);
      $("no").value = String(warmupNo);
      state.no = warmupNo;
      return load(eventNo - warmupNo);
    }

    function loadMarketOpen() {
      return loadAtTime("090000000");
    }

    function chartStampToEventTime(stamp) {
      const safeStamp = Math.max(0, Math.min(86_399_999, Math.floor(stamp)));
      const hour = Math.floor(safeStamp / 3_600_000);
      const minute = Math.floor(safeStamp % 3_600_000 / 60_000);
      const second = Math.floor(safeStamp % 60_000 / 1_000);
      return `${String(hour).padStart(2, "0")}${String(minute).padStart(2, "0")}${String(second).padStart(2, "0")}000`;
    }

    async function seekToTime(timeText, direction = "forward") {
      stopPlayback();
      resetRuntimeState();
      return loadAtTime(timeText, direction);
    }

    function seekBySeconds(seconds) {
      const currentStamp = eventTimeToChartStamp(state.currentEventTime || $("time").value);
      const targetStamp = currentStamp + Number(seconds) * 1000;
      return seekToTime(chartStampToEventTime(targetStamp), seconds < 0 ? "backward" : "forward");
    }

    const TRADE_EVENT_KEYS = ["price", "change_rate", "trade_volume", "acc_volume", "acc_amount", "open", "high", "low", "prev_volume_delta", "prev_volume_ratio", "turnover_rate", "trade_strength"];
    const AFTER_EVENT_KEYS = ["after_sell_total", "after_sell_total_delta", "after_buy_total", "after_buy_total_delta"];
    const BOOK_EVENT_KEYS = [];
    for (const side of ["ask", "bid"]) {
      for (const field of ["price", "qty", "delta"]) {
        for (let level = 1; level <= 10; level++) BOOK_EVENT_KEYS.push(`${side}_${field}_${level}`);
      }
    }
    BOOK_EVENT_KEYS.push("ask_total_qty", "ask_total_delta", "bid_total_qty", "bid_total_delta");
    const BROKER_EVENT_KEYS = [];
    for (const side of ["sell", "buy"]) {
      for (const suffix of ["", "_qty", "_delta"]) {
        for (let level = 1; level <= 5; level++) BROKER_EVENT_KEYS.push(`${side}_broker${suffix}_${level}`);
      }
    }
    BROKER_EVENT_KEYS.push("foreign_sell_estimate", "foreign_sell_estimate_delta", "foreign_buy_estimate", "foreign_buy_estimate_delta", "foreign_net_buy_estimate", "foreign_net_buy_delta");

    function eventSecondKeyLocal(value) {
      const text = String(value || "").replace(/\D/g, "");
      if (!text) return -1;
      return parseInt(text.padStart(9, "0").slice(0, 6), 10);
    }

    function parseEventLine(line, date, code) {
      const p = line.split("\t");
      const type = p[0] || "";
      const ev = {
        date,
        code,
        event_type: type,
        serial: p[1] ?? "",
        no: p[2] ?? "",
        time: p[3] ?? "",
        stamp: p[4] ?? ""
      };
      const keys = type === "1" ? TRADE_EVENT_KEYS : type === "2" ? BOOK_EVENT_KEYS : type === "3" ? AFTER_EVENT_KEYS : type === "4" ? BROKER_EVENT_KEYS : null;
      if (keys) {
        let i = 5;
        for (const key of keys) ev[key] = p[i++] ?? "";
      }
      return ev;
    }

    async function ensureLocalEvents(date, code) {
      const key = `${date}/${code}`;
      if (state.localKey === key && state.localLines) return true;
      if (state.localFailed.has(key)) return false;
      if (state.localLoading) return state.localLoading;
      state.localLoading = (async () => {
        try {
          const bundleRes = await fetch(`api/events-bundle?date=${encodeURIComponent(date)}&code=${encodeURIComponent(code)}`);
          if (!bundleRes.ok || !bundleRes.body) {
            state.localFailed.add(key);
            return false;
          }
          const loader = $("bundleLoader");
          const loaderMb = $("bundleMb");
          if (loader) loader.hidden = false;
          const reader = bundleRes.body.getReader();
          const chunks = [];
          let received = 0;
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
            received += value.byteLength;
            if (loaderMb) loaderMb.textContent = `${Math.round(received / 1048576)} 메가바이트 받는 중`;
            $("status").textContent = `자료를 받는 중입니다... ${Math.round(received / 1048576)} 메가바이트`;
          }
          if (loaderMb) loaderMb.textContent = "화면에 펼치는 중...";
          const buffer = await new Blob(chunks).arrayBuffer();
          const text = new TextDecoder().decode(buffer);
          const lines = text.split("\n");
          if (lines.length && lines[lines.length - 1] === "") lines.pop();
          const nos = new Int32Array(lines.length);
          for (let i = 0; i < lines.length; i++) {
            const parts = lines[i].split("\t", 3);
            nos[i] = parts.length > 2 ? (parseInt(parts[2], 10) || 0) : 0;
          }
          let info = {};
          try {
            const infoRes = await fetch(`api/info?date=${encodeURIComponent(date)}&code=${encodeURIComponent(code)}`);
            if (infoRes.ok) info = await infoRes.json();
          } catch (infoErr) { /* info is optional */ }
          state.localLines = lines;
          state.localNos = nos;
          state.localKey = key;
          state.localInfo = info;
          return true;
        } catch (err) {
          state.localFailed.add(key);
          return false;
        } finally {
          state.localLoading = null;
          const loader = $("bundleLoader");
          if (loader) loader.hidden = true;
        }
      })();
      return state.localLoading;
    }

    function localSnapshot(date, code, no, safeLimit, windowSize, advanceSecond) {
      const nos = state.localNos;
      const lines = state.localLines;
      let lo = 0;
      let hi = nos.length;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (nos[mid] <= no) lo = mid + 1;
        else hi = mid;
      }
      const afterSecond = advanceSecond ? eventSecondKeyLocal(state.currentEventTime) : -1;
      const applySecond = advanceSecond && afterSecond >= 0;
      let targetSecond = null;
      const events = [];
      const end = Math.min(lo + windowSize, nos.length);
      for (let i = lo; i < end; i++) {
        const ev = parseEventLine(lines[i], date, code);
        if (applySecond) {
          const sec = eventSecondKeyLocal(ev.time);
          if (targetSecond === null && sec > afterSecond) targetSecond = sec;
          if (targetSecond !== null && sec > targetSecond) break;
        }
        events.push(ev);
        if (events.length >= safeLimit) break;
      }
      return { date, code, info: state.localInfo || {}, events };
    }

    async function stepEvent(direction) {
      stopPlayback();
      const currentNo = Math.max(1, Number($("no").value || state.no || 1));
      if (direction > 0) return load(1, false);
      const targetNo = Math.max(1, currentNo - 1);
      const warmupNo = Math.max(0, targetNo - 500);
      resetRuntimeState();
      $("no").value = String(warmupNo);
      state.no = warmupNo;
      return load(targetNo - warmupNo, true);
    }

    async function load(limit = 1000, refreshChart = true, advanceSecond = false) {
      const date = $("date").value.replaceAll("-", "");
      const code = resolveCode();
      const no = Math.max(0, Number($("no").value || state.no || 0));
      $("status").textContent = "불러오는 중...";
      const safeLimit = Math.max(1, Math.floor(Number(limit) || 1));
      const batches = Math.max(1, Math.ceil(safeLimit / 500));
      let data;
      if (await ensureLocalEvents(date, code)) {
        data = localSnapshot(date, code, no, safeLimit, batches * 500, advanceSecond);
      } else {
        const nextSecondQuery = advanceSecond
          ? `&next_second=1&after_time=${encodeURIComponent(state.currentEventTime)}`
          : "";
        const res = await fetch(`api/snapshot?date=${encodeURIComponent(date)}&code=${encodeURIComponent(code)}&no=${no}&batches=${batches}&limit=${safeLimit}${nextSecondQuery}`);
        data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || "화면을 불러오지 못했습니다");
      }
      const trade = latest(data.events, "1");
      const book = latest(data.events, "2");
      const after = latest(data.events, "3");
      const broker = latest(data.events, "4");
      state.info = data.info || {};
      mergeLatest(data.events);
      const currentEvent = data.events[data.events.length - 1];
      if (currentEvent?.time) state.currentEventTime = currentEvent.time;
      const fills = processPendingOrders(data.events);
      renderTop(data.info, state.lastTrade);
      renderBook(state.lastBook);
      renderBrokers(state.lastBroker);
      const maxNo = data.events.reduce((m, e) => Math.max(m, Number(e.no || 0)), no);
      state.no = maxNo;
      $("no").value = String(maxNo);
      $("time").value = state.currentEventTime || state.lastTrade.time || state.lastBook.time || state.lastAfter.time || "";
      if (!state.orderPriceLocked) $("priceInput").value = fmt(currentPrice());
      updatePortfolio();
      const pending = state.pendingOrders.length ? ` · 대기 ${state.pendingOrders.length}건` : "";
      const filled = fills.length ? ` · ${fills.join(", ")}` : "";
      $("status").textContent = `${data.date} · 장면 ${data.events.length.toLocaleString("ko-KR")}개${pending}${filled}`;
      const dl = $("datelineDate");
      const dt = String(data.date || "").replaceAll("-", "");
      if (dl && dt.length === 8) dl.textContent = `${dt.slice(0, 4)}년 ${Number(dt.slice(4, 6))}월 ${Number(dt.slice(6, 8))}일`;
      if (refreshChart) await loadChart(date, code);
      else drawChart(chartRowsAtCurrentTime());
      return data.events.length;
    }

    $("dateButton").addEventListener("click", () => {
      const input = $("date");
      if (typeof input.showPicker === "function") input.showPicker();
      else input.focus();
    });
    $("date").addEventListener("change", () => {
      $("no").value = "0";
      resetRuntimeState();
      loadSymbols()
        .then(() => loadMarketOpen())
        .catch((err) => $("status").textContent = errorText(err));
    });
    $("code").addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        $("no").value = "0";
        resetRuntimeState();
        loadMarketOpen().catch((err) => $("status").textContent = errorText(err));
      }
    });
    $("search").addEventListener("click", () => {
      $("no").value = "0";
      resetRuntimeState();
      loadMarketOpen().catch((err) => $("status").textContent = errorText(err));
    });
    $("quoteRefresh").addEventListener("click", () => {
      load().catch((err) => $("status").textContent = errorText(err));
    });
    $("buyButton").addEventListener("click", () => order("buy"));
    $("sellButton").addEventListener("click", () => order("sell"));
    $("ordersList").addEventListener("click", (event) => {
      const target = event.target.closest("[data-cancel-order]");
      if (!target) return;
      const id = Number(target.dataset.cancelOrder);
      state.pendingOrders = state.pendingOrders.filter((order) => order.id !== id);
      renderOrders();
      $("status").textContent = `대기 주문 취소 #${id}`;
    });
    $("clearOrders").addEventListener("click", () => {
      const count = state.pendingOrders.length;
      state.pendingOrders = [];
      renderOrders();
      $("status").textContent = count ? `대기 주문 ${count}건 취소` : "취소할 대기 주문이 없습니다";
    });
    $("marketButton").addEventListener("click", () => {
      $("priceInput").value = "";
      state.orderPriceLocked = false;
      $("status").textContent = "시장가 모드";
    });
    $("priceInput").addEventListener("input", () => {
      state.orderPriceLocked = Boolean($("priceInput").value.trim());
    });
    $("asks").addEventListener("click", (event) => {
      const target = event.target.closest("[data-price]");
      if (target) selectOrderPrice(target.dataset.price);
    });
    $("bids").addEventListener("click", (event) => {
      const target = event.target.closest("[data-price]");
      if (target) selectOrderPrice(target.dataset.price);
    });
    $("speedLabel").addEventListener("click", cycleSpeed);
    $("speedChip").addEventListener("click", cycleSpeed);
    $("chartReload").addEventListener("click", () => {
      const date = $("date").value.replaceAll("-", "");
      const code = resolveCode();
      loadChart(date, code).catch((err) => $("status").textContent = errorText(err));
    });
    $("chartGap").addEventListener("change", () => {
      const date = $("date").value.replaceAll("-", "");
      const code = resolveCode();
      loadChart(date, code).catch((err) => $("status").textContent = errorText(err));
    });
    document.querySelectorAll("[data-size-pct]").forEach((button) => {
      button.addEventListener("click", () => applySizePercent(Number(button.dataset.sizePct)));
    });
    window.addEventListener("resize", () => {
      const date = $("date").value.replaceAll("-", "");
      const code = resolveCode();
      loadChart(date, code).catch(() => {});
    });
    document.querySelectorAll("[data-seek-time]").forEach((button) => {
      button.addEventListener("click", () => seekToTime(button.dataset.seekTime).catch((err) => $("status").textContent = errorText(err)));
    });
    document.querySelectorAll("[data-seek-seconds]").forEach((button) => {
      button.addEventListener("click", () => seekBySeconds(Number(button.dataset.seekSeconds)).catch((err) => $("status").textContent = errorText(err)));
    });
    document.querySelectorAll("[data-step-event]").forEach((button) => {
      button.addEventListener("click", () => stepEvent(Number(button.dataset.stepEvent)).catch((err) => $("status").textContent = errorText(err)));
    });
    $("play").addEventListener("click", () => {
      if (state.timer) {
        stopPlayback();
        return;
      }
      startPlayback();
    });
    updateSpeedUi();
    applyInitialUrlParams();
    loadReplayDates()
      .then(() => loadSymbols())
      .then(async () => {
        if (state.initialJumpTime) {
          const initialTime = state.initialJumpTime;
          state.initialJumpTime = "";
          return loadAtTime(initialTime);
        }
        return loadMarketOpen();
      })
      .catch((err) => $("status").textContent = errorText(err));
  </script>
</body>
</html>
